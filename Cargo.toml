[package]
name = "lampdesigner"
version = "0.1.0"
edition = "2021"
description = "Parametric 3D-printable lampshade designer with light simulation and 3MF export"

[dependencies]
eframe = "0.31"
glam = "0.29"
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
